version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shopsmart-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-shopsmart}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d shopsmart"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shopsmart-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://admin:password123@postgres:5432/shopsmart?schema=public
      PORT: 5000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopsmart-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: shopsmart-client
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - shopsmart-network

networks:
  shopsmart-network:
    driver: bridge

volumes:
  postgres_data:
