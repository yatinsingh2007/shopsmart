version: '3.8'

services:
  server:
    platform: linux/amd64   # 🔴 force correct architecture
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shopsmart-server
    restart: always
    ports:
      - "2000:5000"
    environment:
      DATABASE_URL: postgresql://admin:password123@postgres:5432/shopsmart
      PORT: 2000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  client:
    platform: linux/amd64   # 🔴 same here
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: shopsmart-client
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  postgres_data: