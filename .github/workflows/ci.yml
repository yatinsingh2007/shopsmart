name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          cd server
          npm ci

      - name: Generate Prisma Client
        run: |
          cd server
          npx prisma generate

      - name: Run Linting
        run: |
          cd server
          npm run lint

      - name: Run Tests
        run: |
          cd server
          npm test

  docker-build:
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Server Image
        run: docker build -t shopsmart-server ./server

      - name: Build Client Image
        run: docker build -t shopsmart-client ./client