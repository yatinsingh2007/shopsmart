name: Unified CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  PROJECT_NAME: shopsmart

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Server - Install, Generate, Lint & Test
        run: |
          cd server
          npm ci
          npx prisma generate
          npm run lint
          npm test

      - name: Client - Install & Lint
        run: |
          cd client
          npm ci
          npm run lint

  terraform:
    name: Infrastructure (Terraform)
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Cleanup Orphaned Resources
        working-directory: ./terraform
        run: |
          # If resources exist in AWS but NOT in Terraform state, delete them so Terraform can recreate them.
          if ! terraform state list | grep -q "aws_ecr_repository.server"; then
            aws ecr delete-repository --repository-name shopsmart-server --force 2>/dev/null || true
          fi
          if ! terraform state list | grep -q "aws_ecr_repository.client"; then
            aws ecr delete-repository --repository-name shopsmart-client --force 2>/dev/null || true
          fi
          if ! terraform state list | grep -q "aws_ecr_repository.db"; then
            aws ecr delete-repository --repository-name shopsmart-db --force 2>/dev/null || true
          fi
          
          if ! terraform state list | grep -q "aws_cloudwatch_log_group.main"; then
            aws logs delete-log-group --log-group-name /ecs/shopsmart 2>/dev/null || true
          fi
          
          if ! terraform state list | grep -q "aws_lb.main"; then
            ALB_ARN=$(aws elbv2 describe-load-balancers --names shopsmart-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text 2>/dev/null || echo "")
            if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ] && [ "$ALB_ARN" != "null" ]; then
              aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN" 2>/dev/null || true
              sleep 10
            fi
          fi
          
          if ! terraform state list | grep -q "aws_lb_target_group.main"; then
            TG_ARN=$(aws elbv2 describe-target-groups --names shopsmart-tg --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || echo "")
            if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ] && [ "$TG_ARN" != "null" ]; then
              aws elbv2 delete-target-group --target-group-arn "$TG_ARN" 2>/dev/null || true
            fi
          fi
          
          if ! terraform state list | grep -q "aws_ecs_service.main"; then
            aws ecs update-service --cluster shopsmart-cluster --service shopsmart-service --desired-count 0 2>/dev/null || true
            aws ecs delete-service --cluster shopsmart-cluster --service shopsmart-service --force 2>/dev/null || true
            sleep 15
          fi
          
          if ! terraform state list | grep -q "aws_ecs_cluster.main"; then
            aws ecs delete-cluster --cluster shopsmart-cluster 2>/dev/null || true
          fi

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve

  build-and-push:
    name: Build & Push to ECR
    needs: terraform
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: meta
        run: |
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT
          echo "server_image=${REGISTRY}/${{ env.PROJECT_NAME }}-server" >> $GITHUB_OUTPUT
          echo "client_image=${REGISTRY}/${{ env.PROJECT_NAME }}-client" >> $GITHUB_OUTPUT
          echo "sha_tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.server_image }}:latest
            ${{ steps.meta.outputs.server_image }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha,scope=server
          cache-to:   type=gha,mode=max,scope=server

      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.client_image }}:latest
            ${{ steps.meta.outputs.client_image }}:${{ steps.meta.outputs.sha_tag }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=client
          cache-to:   type=gha,mode=max,scope=client

  deploy:
    name: Deploy to ECS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Force new deployment on ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.PROJECT_NAME }}-cluster \
            --service ${{ env.PROJECT_NAME }}-service \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.PROJECT_NAME }}-cluster \
            --services ${{ env.PROJECT_NAME }}-service
