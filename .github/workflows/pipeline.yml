name: Unified CI/CD Pipeline

on:
  workflow_dispatch:
    
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  PROJECT_NAME: shopsmart

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Server - Install, Generate, Lint & Test
        run: |
          cd server
          npm ci
          npx prisma generate
          npm run lint
          npm test

      - name: Client - Install & Lint
        run: |
          cd client
          npm ci
          npm run lint

  build-and-push:
    name: Build & Push to ECR
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      server_image: ${{ steps.meta.outputs.server_image }}
      client_image: ${{ steps.meta.outputs.client_image }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: meta
        run: |
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          echo "ECR Registry: $REGISTRY"
          
          echo "server_image=${REGISTRY}/${{ env.PROJECT_NAME }}-server" >> $GITHUB_OUTPUT
          echo "client_image=${REGISTRY}/${{ env.PROJECT_NAME }}-client" >> $GITHUB_OUTPUT
          echo "sha_tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-server:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-server:latest

      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-client:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-client:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

  terraform:
    name: Infrastructure (Terraform)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply \
            -var="server_image_tag=${{ needs.build-and-push.outputs.sha_tag }}" \
            -var="client_image_tag=${{ needs.build-and-push.outputs.sha_tag }}" \
            -auto-approve

  deploy:
    name: Deploy to ECS
    needs: terraform
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Rollout ECS Services
        run: |
          CLUSTER_NAME="${{ env.PROJECT_NAME }}-cluster"
          SERVER_SERVICE="${{ env.PROJECT_NAME }}-service"
          CLIENT_SERVICE="${{ env.PROJECT_NAME }}-client-service"

          # Check if cluster exists
          if aws ecs describe-clusters --clusters $CLUSTER_NAME --query "clusters[?status=='ACTIVE']" --output text | grep -q $CLUSTER_NAME; then
            echo "Cluster $CLUSTER_NAME is active. Updating services..."
            
            # Update Server Service if it exists
            if aws ecs describe-services --cluster $CLUSTER_NAME --services $SERVER_SERVICE --query "services[?status=='ACTIVE']" --output text | grep -q $SERVER_SERVICE; then
              echo "Updating $SERVER_SERVICE..."
              aws ecs update-service --cluster $CLUSTER_NAME --service $SERVER_SERVICE --force-new-deployment
            fi

            # Update Client Service if it exists
            if aws ecs describe-services --cluster $CLUSTER_NAME --services $CLIENT_SERVICE --query "services[?status=='ACTIVE']" --output text | grep -q $CLIENT_SERVICE; then
              echo "Updating $CLIENT_SERVICE..."
              aws ecs update-service --cluster $CLUSTER_NAME --service $CLIENT_SERVICE --force-new-deployment
            fi
          else
            echo "Cluster $CLUSTER_NAME not found or not active. Skipping manual rollout."
          fi

      - name: Wait for services stability
        run: |
          CLUSTER_NAME="${{ env.PROJECT_NAME }}-cluster"
          SERVER_SERVICE="${{ env.PROJECT_NAME }}-service"
          CLIENT_SERVICE="${{ env.PROJECT_NAME }}-client-service"

          # Only wait if cluster exists
          if aws ecs describe-clusters --clusters $CLUSTER_NAME --query "clusters[?status=='ACTIVE']" --output text | grep -q $CLUSTER_NAME; then
            echo "Waiting for services to become stable..."
            aws ecs wait services-stable --cluster $CLUSTER_NAME --services $SERVER_SERVICE $CLIENT_SERVICE 2>/dev/null || echo "Stability check failed or timed out, but proceeding..."
          fi